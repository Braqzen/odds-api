[package]
name = "odds-api"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
futures-util = "0.3.34"
maiya = { git = "https://github.com/Braqzen/maiya.git", tag = "v0.1.0" }
opentelemetry_sdk = "0.32.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
