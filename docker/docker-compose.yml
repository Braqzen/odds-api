services:
  client:
    image: odds-api:latest
    environment:
      RUST_LOG: info
      ODDS_REST_URL: https://v5.oddspapi.io/en
      ODDS_WS_URL: wss://v5.oddspapi.io/ws
      ODDS_API_KEY: abc
      ODDS_SPORT_IDS: 10,11,12
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry-alloy:4318
    restart: unless-stopped

  telemetry-grafana:
    image: grafana/grafana:12.2
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../telemetry/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data-volume:/var/lib/grafana
    depends_on:
      - telemetry-loki
    restart: unless-stopped

  telemetry-loki:
    image: grafana/loki:3.7
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ../telemetry/loki/loki.yaml:/etc/loki/loki.yaml
      - loki-data-volume:/loki
    restart: unless-stopped

  telemetry-alloy:
    image: grafana/alloy:v1.17.0
    volumes:
      - ../telemetry/grafana/alloy:/etc/alloy
      - alloy-data-volume:/var/lib/alloy/data
    command: run --disable-reporting /etc/alloy/config.alloy
    depends_on:
      - telemetry-loki
    restart: unless-stopped

volumes:
  grafana-data-volume:
  loki-data-volume:
  alloy-data-volume:
